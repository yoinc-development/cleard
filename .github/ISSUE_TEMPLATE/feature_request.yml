name: Feature Request
description: Suggest an idea or enhancement for cleard
title: "[Feature]: "
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature. Please fill out all fields below - issues missing relevant data will be closed.
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this solve, or what's missing today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Mockups, screenshots, or other context.
    validations:
      required: false

name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch: # smoke-test packaging without cutting a tag

permissions:
  contents: write # required for action-gh-release to create the release

jobs:
  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="${GITHUB_REF#refs/tags/}"; v="${v#v}"
          else
            v="0.0.0" # workflow_dispatch dry run
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build installer
        working-directory: desktop
        run: npm run build -- --app-version ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4 # always keep the build output
        with:
          name: cleard-installer-windows
          path: target/dist/cleard-setup-*.exe

  macos-dmg:
    name: Build macOS DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="${GITHUB_REF#refs/tags/}"; v="${v#v}"
          else
            v="0.0.0" # workflow_dispatch dry run
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build DMG
        working-directory: desktop
        run: npm run build -- --app-version ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: cleard-dmg-${{ matrix.arch }}
          path: target/dist/cleard-*.dmg

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ windows-installer, macos-dmg ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cleard-setup-*.exe
            dist/cleard-*.dmg
          generate_release_notes: true
          body: |
            **macOS:** the app is not yet notarized. On first launch, open System Settings -> Privacy & Security and click "Open Anyway".

name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch: # smoke-test packaging without cutting a tag

permissions:
  contents: write # required for action-gh-release to create the release

jobs:
  windows-installer:
    name: Build installer + publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/*') {
                 $env:GITHUB_REF -replace '^refs/tags/v?', ''
               } else { '0.0.0' }   # workflow_dispatch dry run
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build installer
        working-directory: desktop
        run: npm run build -- --app-version ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4 # always keep the build output
        with:
          name: cleard-installer
          path: target/dist/cleard-setup-*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') # skipped on workflow_dispatch
        uses: softprops/action-gh-release@v2
        with:
          files: target/dist/cleard-setup-*.exe
          generate_release_notes: true
